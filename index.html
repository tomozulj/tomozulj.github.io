<template id="qr-svg"><svg width="168" height="168" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 31 31" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h31v31H0z"/><path stroke="#0f172a" d="M1 1.5h7m2 0h2m1 0h1m1 0h1m3 0h2m2 0h7M1 2.5h1m5 0h1m1 0h1m4 0h1m5 0h2m1 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m3 0h1m4 0h1m2 0h1m3 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m2 0h2m1 0h2m2 0h1m2 0h2m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h2m2 0h2m2 0h4m2 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m3 0h3m1 0h3m1 0h2m2 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 8.5h2m2 0h1m1 0h1m1 0h1M1 9.5h1m1 0h1m1 0h1m1 0h1m4 0h2m3 0h2m1 0h2m3 0h1m2 0h1M2 10.5h1m1 0h3m1 0h3m1 0h1m1 0h1m1 0h2m3 0h1m1 0h1m2 0h1m2 0h1M2 11.5h2m1 0h1m1 0h1m4 0h1m2 0h3m1 0h1m1 0h1m2 0h1m2 0h3M1 12.5h1m1 0h1m2 0h1m1 0h1m1 0h1m3 0h2m1 0h7m1 0h1m2 0h1M3 13.5h1m3 0h5m1 0h1m1 0h2m1 0h1m3 0h2m2 0h1m1 0h2M1 14.5h1m1 0h1m6 0h1m4 0h2m4 0h1m1 0h1m2 0h1m2 0h1M2 15.5h3m2 0h2m1 0h5m3 0h1m3 0h5m1 0h2M1 16.5h5m4 0h2m1 0h1m2 0h1m1 0h3m4 0h2m1 0h1M1 17.5h2m1 0h1m1 0h2m1 0h1m1 0h1m1 0h1m3 0h7m2 0h1m1 0h2M3 18.5h1m1 0h1m4 0h1m1 0h1m1 0h1m1 0h2m3 0h3m2 0h2m1 0h1M1 19.5h1m3 0h1m1 0h4m2 0h1m1 0h4m3 0h1m1 0h1m3 0h2M2 20.5h1m1 0h1m1 0h1m1 0h1m1 0h3m1 0h2m1 0h3m1 0h2m2 0h2m1 0h1M1 21.5h1m2 0h4m1 0h1m1 0h1m1 0h1m1 0h2m2 0h1m1 0h5M9 22.5h1m2 0h1m2 0h2m3 0h2m3 0h1m1 0h3M1 23.5h7m5 0h2m3 0h1m1 0h2m1 0h1m1 0h2m1 0h2M1 24.5h1m5 0h1m3 0h1m4 0h1m4 0h1m3 0h2m2 0h1M1 25.5h1m1 0h3m1 0h1m1 0h3m5 0h1m3 0h5M1 26.5h1m1 0h3m1 0h1m3 0h2m1 0h1m1 0h3m1 0h2m2 0h2m1 0h1M1 27.5h1m1 0h3m1 0h1m1 0h3m1 0h1m2 0h2m1 0h2m3 0h3m2 0h1M1 28.5h1m5 0h1m2 0h1m2 0h1m1 0h1m1 0h8m3 0h1M1 29.5h7m1 0h3m1 0h1m2 0h1m2 0h1m1 0h1m2 0h3m1 0h2"/></svg>
</template>
<script>
(function () {
  var SHARE_URL = "https://tomozulj.github.io/";
  var d = JSON.parse(document.getElementById('dpp-data').textContent);
  var raw = document.getElementById('raw-data').textContent;
  var app = document.getElementById('app');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function icon(name, cls) { return el('span', 'ms' + (cls ? ' ' + cls : ''), name); }
  function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
  function link(href, text) {
    var a = el('a', null, text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; return a;
  }
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmt(iso) {
    var t = new Date(iso); if (isNaN(t)) return iso;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return t.getDate() + ' ' + MON[t.getMonth()] + ' ' + t.getFullYear() + ', ' + p(t.getHours()) + ':' + p(t.getMinutes());
  }
  var blobUrl = URL.createObjectURL(new Blob([raw], { type: 'application/json' }));

  // header card
  var head = el('section', 'card head');
  var row = el('div', 'row');
  var logo = el('span', 'logo'); logo.appendChild(icon('battery_charging_full'));
  var info = el('div'); info.style.minWidth = 0; info.style.flex = '1';
  add(info, el('h1', null, d.title));
  if (d.serial) info.appendChild(el('p', 'serial', d.serial));
  var badge = el('span', 'badge' + (d.status === 'invalid' ? ' invalid' : ''));
  add(badge, icon(d.status === 'valid' ? 'verified' : d.status === 'invalid' ? 'error' : 'help'), document.createTextNode(d.statusLabel));
  info.appendChild(badge);
  add(row, logo, info);
  var meta = el('dl', 'meta');
  function metaItem(label, value, mono) {
    var w = el('div'); var dd = el('dd', mono ? 'mono' : null, value);
    add(w, el('dt', null, label), dd); meta.appendChild(w);
  }
  if (d.operator) metaItem(d.operatorLabel, d.operator);
  metaItem('Passport ID', d.upi, true);
  if (d.lastUpdated) metaItem('Last updated', fmt(d.lastUpdated));
  add(head, row, meta);

  // groups
  var groups = el('div', 'groups');
  d.groups.forEach(function (g) {
    if (g.id === 'details') {
      var det = el('details', 'card');
      var sum = el('summary'); add(sum, icon(g.icon), document.createTextNode(g.title));
      det.appendChild(sum);
      g.rows.forEach(function (r) {
        var c = el('div', 'det');
        if (r.href) c.appendChild(link(r.href, r.linkText)); else c.textContent = r.value;
        det.appendChild(c);
      });
      var m = el('div', 'det'); m.appendChild(link(blobUrl, 'Machine-readable data (JSON)'));
      det.appendChild(m); groups.appendChild(det);
      return;
    }
    var sec = el('section', 'card grp');
    var h = el('h2'); add(h, icon(g.icon), document.createTextNode(g.title));
    var dl = el('dl');
    g.rows.forEach(function (r) {
      var kv = el('div', 'kv');
      var dd = el('dd', 'v'); dd.style.margin = 0;
      if (r.href) dd.appendChild(link(r.href, r.linkText)); else dd.appendChild(document.createTextNode(r.value));
      if (r.unit) dd.appendChild(el('span', 'u', '\u00a0' + (r.href ? '· ' : '') + r.unit));
      if (r.note) dd.appendChild(el('span', 'n', r.note));
      if (r.fullValue) dd.appendChild(el('span', 'f', r.fullValue));
      add(kv, el('dt', 'k', r.label), dd); dl.appendChild(kv);
    });
    add(sec, h, dl); groups.appendChild(sec);
  });
  if (!d.groups.length) groups.appendChild(el('div', 'card head', 'This passport has no public data to show.'));

  // QR + identifier
  var share = el('section', 'card share');
  var h2 = el('h2'); add(h2, icon('qr_code_2'), document.createTextNode('Passport QR & identifier'));
  var qr = el('div', 'qr'); var box = el('div', 'box');
  box.innerHTML = document.getElementById('qr-svg').innerHTML; // static, generated at build time
  box.setAttribute('role', 'img'); box.setAttribute('aria-label', 'QR code for ' + SHARE_URL);
  qr.appendChild(box);
  var sdl = el('dl'); var w = el('div');
  add(w, el('dt', null, 'Product identifier'), el('dd', 'mono', d.upi), el('dd', 'sub', SHARE_URL));
  sdl.appendChild(w);
  if (d.dppId) { var w2 = el('div'); var dd2 = el('dd', 'mono', d.dppIdShort); dd2.title = d.dppId; add(w2, el('dt', null, 'Passport reference'), dd2); sdl.appendChild(w2); }
  var btn = el('a', 'btn'); btn.href = blobUrl; btn.target = '_blank'; btn.rel = 'noopener';
  add(btn, icon('data_object'), document.createTextNode('Machine-readable data'));
  add(share, h2, qr, sdl, btn);

  var layout = el('div', 'layout');
  var aside = el('aside'); aside.appendChild(share);
  add(layout, groups, aside);

  add(app, head, layout,
    el('p', 'foot', 'Public information only. Restricted data is available to authorised parties after sign-in.'),
    el('p', 'foot demo', 'Demo page with synthetic example data.'));
})();
</script>
