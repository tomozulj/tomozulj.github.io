<title>DPP demo · QR + phone preview</title>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: oklch(95.5% 0.012 250); color: oklch(30% 0.035 258); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 72rem; min-height: 100vh; margin: 0 auto; padding: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3rem; }
  .qrcol { width: 100%; max-width: 24rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
  .qrbox { background: oklch(98.5% 0.008 250); border-radius: 1.5rem; padding: 1rem; box-shadow: 0 10px 25px -5px rgb(0 0 0 / .2); line-height: 0; }
  .qrbox > div { background: #fff; border-radius: 1rem; padding: 1rem; }
  a { color: oklch(55% 0.19 255); word-break: break-all; font-size: .875rem; }
  .open { display: inline-block; padding: .4rem .9rem; border: 1px solid currentColor; border-radius: .625rem; text-decoration: none; }
  .slot { width: 410px; height: 860px; position: relative; }
  .scale { position: absolute; top: 0; left: 0; width: 430px; height: 900px; transform: scale(0.955); transform-origin: top left; }
  .bezel { width: 430px; height: 900px; padding: 12px 20px 18px; border-radius: 64px; background: #0b0f19; border: 3px solid #394150; box-shadow: 0 30px 60px -15px rgb(0 0 0 / .55), inset 0 0 0 2px #1c2233; display: flex; flex-direction: column; position: relative; }
  .status { height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; color: #f1f5f9; font-size: 13px; font-weight: 600; }
  .notch { width: 120px; height: 26px; background: #000; border-radius: 0 0 18px 18px; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
  .screen { width: 390px; height: 790px; border: 0; border-radius: 28px; background: #fff; flex: none; }
  .home { width: 130px; height: 5px; border-radius: 3px; background: #cbd5e1; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); }
  @media (max-width: 900px) { .slot { display: none; } }
</style>
